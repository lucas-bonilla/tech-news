<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal — Tech News</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('signal_theme') || 'dark'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    /* ── DARK THEME (default) ──────────────────────── */
    :root {
      --bg: #0e1217;
      --surface: #1c1f26;
      --surface-2: #242830;
      --hover: #2a2e38;
      --border: #2d323b;
      --border-2: #424856;
      --text: #ffffff;
      --text-2: #a8b3cf;
      --text-3: #8089a0;
      --accent: #ce3df3;
      --accent-soft: rgba(206, 61, 243, 0.12);
      --primary-bg: #ffffff;
      --primary-fg: #0e1217;
      --ai: #c084fc;
      --infra: #38bdf8;
      --sec: #fb7185;
      --biz: #fbbf24;
      --other: #a8b3cf;
      --ok: #39e58c;
      --warn: #fbbf24;
      --err: #fb7185;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      --topbar-h: 56px;
      --sidebar-w: 248px;
      --r: 16px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color-scheme: dark;
    }

    /* ── LIGHT THEME ───────────────────────────────── */
    [data-theme="light"] {
      --bg: #f2f4f7;
      --surface: #ffffff;
      --surface-2: #eef1f5;
      --hover: #e6eaf0;
      --border: #dde1e8;
      --border-2: #c3c9d3;
      --text: #0e1217;
      --text-2: #4b5262;
      --text-3: #646b7a;
      --accent: #a21caf;
      --accent-soft: rgba(162, 28, 175, 0.08);
      --primary-bg: #0e1217;
      --primary-fg: #ffffff;
      --ai: #7c3aed;
      --infra: #0369a1;
      --sec: #be123c;
      --biz: #b45309;
      --other: #646b7a;
      --ok: #15803d;
      --warn: #b45309;
      --err: #be123c;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      color-scheme: light;
    }

    [data-topic] { --t: var(--other); }
    [data-topic="ai"] { --t: var(--ai); }
    [data-topic="infra"] { --t: var(--infra); }
    [data-topic="sec"] { --t: var(--sec); }
    [data-topic="biz"] { --t: var(--biz); }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.25s ease, color 0.25s ease;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    a {
      color: inherit;
    }

    svg {
      display: block;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── BUTTONS ───────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
    }

    .btn:hover {
      color: var(--text);
      background: var(--hover);
      border-color: var(--border-2);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 36px;
      padding: 0;
    }

    .btn-primary,
    .btn-primary:hover {
      background: var(--primary-bg);
      border-color: var(--primary-bg);
      color: var(--primary-fg);
    }

    .btn-primary:hover {
      opacity: 0.88;
    }

    .btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    /* ── TOP BAR ───────────────────────────────────── */
    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px 0 20px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .menu-btn {
      display: none;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
      width: calc(var(--sidebar-w) - 36px);
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--primary-bg);
      color: var(--primary-fg);
      display: grid;
      place-items: center;
    }

    .logo-mark svg {
      width: 18px;
      height: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--text-3);
      font-weight: 600;
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      align-items: center;
    }

    .search svg {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--text-3);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 0 40px 0 38px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search input::placeholder {
      color: var(--text-3);
    }

    .search input:focus {
      border-color: var(--text-2);
    }

    .search kbd {
      position: absolute;
      right: 10px;
      font-family: inherit;
      font-size: 11px;
      line-height: 18px;
      color: var(--text-3);
      border: 1px solid var(--border-2);
      border-radius: 6px;
      padding: 0 6px;
      pointer-events: none;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── SIDEBAR ───────────────────────────────────── */
    .sidebar {
      position: fixed;
      top: var(--topbar-h);
      bottom: 0;
      left: 0;
      width: var(--sidebar-w);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      scrollbar-width: thin;
      z-index: 40;
    }

    .nav-section h4 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      padding: 0 10px 6px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--text-2);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .nav-item:hover {
      background: var(--surface);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
    }

    .nav-item>svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .nav-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-item .count {
      font-size: 12px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .hash {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--t, var(--other));
      background: color-mix(in srgb, var(--t, var(--other)) 16%, transparent);
    }

    .hash-text {
      font-size: 9px;
      letter-spacing: 0.02em;
    }

    .sidebar-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px 10px 4px;
      border-top: 1px solid var(--border);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-2);
    }

    .status-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
    }

    .status-dot.loading {
      background: var(--warn);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status-dot.ok {
      background: var(--ok);
    }

    .status-dot.error {
      background: var(--err);
    }

    .key-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .key-field input {
      width: 100%;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 0 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .key-field input:focus {
      border-color: var(--text-2);
    }

    .key-field input::placeholder {
      color: var(--text-3);
    }

    .sidebar-credit {
      font-size: 11px;
      color: var(--text-3);
    }

    .backdrop {
      display: none;
    }

    /* ── MAIN ──────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      padding: calc(var(--topbar-h) + 28px) 32px 64px;
      min-height: 100vh;
    }

    .main-inner {
      max-width: 1640px;
      margin: 0 auto;
    }

    .feed-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .feed-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .feed-title h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .article-count {
      font-size: 13px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 6px 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }

    .chip:hover {
      color: var(--text);
      border-color: var(--border-2);
    }

    .chip svg {
      width: 14px;
      height: 14px;
    }

    .view-toggle {
      display: flex;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .view-btn {
      width: 32px;
      height: 28px;
      border: 0;
      border-radius: 7px;
      background: none;
      color: var(--text-3);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.12s, color 0.12s;
    }

    .view-btn:hover {
      color: var(--text);
    }

    .view-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .view-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── FEED ──────────────────────────────────────── */
    #articles-container.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    #articles-container.list-view {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 960px;
    }

    /* ── CARD ──────────────────────────────────────── */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 12px 12px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      border-color: var(--border-2);
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 32px;
      padding: 0 4px;
      margin-bottom: 10px;
    }

    .src-avatar {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--av);
    }

    .src-avatar b {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .src-avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 15%;
      object-fit: contain;
      background: #fff;
    }

    .src-avatar.sm {
      width: 20px;
      height: 20px;
      border-radius: 6px;
    }

    .src-avatar.sm b {
      font-size: 10px;
    }

    .src-avatar.sm img {
      padding: 2px;
    }

    .read-btn {
      height: 32px;
      padding: 0 12px;
      opacity: 0;
    }

    .read-btn svg {
      width: 14px;
      height: 14px;
    }

    .card:hover .read-btn,
    .card:focus-within .read-btn {
      opacity: 1;
    }

    @media (hover: none) {
      .read-btn {
        opacity: 1;
      }
    }

    .card-title {
      padding: 0 4px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 0 4px;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
    }

    .tag-topic {
      color: var(--t);
      border-color: color-mix(in srgb, var(--t) 40%, transparent);
      background: color-mix(in srgb, var(--t) 10%, transparent);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 0 4px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .card-meta .src {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-spacer {
      flex: 1;
      min-height: 12px;
    }

    .card-cover {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .card-cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .card-cover img {
      transform: scale(1.03);
    }

    .cover-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      background:
        radial-gradient(120% 120% at 0% 0%, color-mix(in srgb, var(--t) 45%, transparent), transparent 60%),
        linear-gradient(135deg, color-mix(in srgb, var(--t) 18%, var(--surface-2)), var(--surface-2));
    }

    .cover-fallback span {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: color-mix(in srgb, var(--t) 60%, var(--text));
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }

    .act {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      min-width: 32px;
      padding: 0 8px;
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .act:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .act svg {
      width: 18px;
      height: 18px;
    }

    .act-push {
      margin-left: auto;
    }

    .act.copied {
      color: var(--ok);
    }

    .act-tldr {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .act-tldr svg {
      width: 14px;
      height: 14px;
    }

    .act-tldr.loading {
      color: var(--text-3);
      background: none;
      font-weight: 500;
    }

    .summary-spinner {
      width: 12px;
      height: 12px;
      border: 1.5px solid var(--border-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* ── LIST VIEW ─────────────────────────────────── */
    .list-view .card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 140px;
      grid-template-areas:
        "top title cover"
        "top tags  cover"
        "top meta  cover";
      grid-template-rows: auto auto 1fr;
      column-gap: 16px;
      padding: 14px;
      align-items: start;
    }

    .list-view .card:hover {
      box-shadow: none;
    }

    .list-view .card-top {
      grid-area: top;
      height: auto;
      margin: 0;
      padding: 0;
    }

    .list-view .read-btn,
    .list-view .card-spacer,
    .list-view .card-actions {
      display: none;
    }

    .list-view .card-title {
      grid-area: title;
      padding: 0;
      font-size: 15px;
      -webkit-line-clamp: 2;
    }

    .list-view .card-tags {
      grid-area: tags;
      padding: 0;
      margin-top: 6px;
    }

    .list-view .card-meta {
      grid-area: meta;
      padding: 0;
      margin-top: 6px;
    }

    .list-view .card-cover {
      grid-area: cover;
      align-self: center;
      border-radius: 10px;
    }

    .list-view .cover-fallback span {
      font-size: 13px;
    }

    /* ── SKELETON ──────────────────────────────────── */
    .skeleton-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }

    .skel {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--hover) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
      border-radius: 6px;
    }

    /* ── EMPTY ─────────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 96px 20px;
      text-align: center;
      color: var(--text-3);
      font-size: 14px;
    }

    .empty-state strong {
      display: block;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 4px;
    }

    /* ── MODAL ─────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 24px;
      overflow-y: auto;
      background: rgba(5, 8, 12, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    [data-theme="light"] .modal-overlay {
      background: rgba(15, 23, 42, 0.35);
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.15s ease;
    }

    .modal {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: slideUp 0.2s ease;
    }

    .modal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-source {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .modal-source strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
    }

    .modal-source span {
      font-size: 12px;
      color: var(--text-3);
    }

    .modal-bar-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px 28px 32px;
    }

    .modal-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .modal-body .card-tags {
      padding: 0;
      margin: 0;
    }

    .modal-summary {
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
      background: var(--accent-soft);
      font-size: 15px;
      line-height: 1.65;
    }

    .modal-summary-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .modal-summary-label svg {
      width: 14px;
      height: 14px;
    }

    .modal-cover {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .modal-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-description {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text-2);
    }

    /* ── RESPONSIVE ────────────────────────────────── */
    @media (max-width: 1023px) {
      .menu-btn {
        display: inline-flex;
      }

      .logo {
        width: auto;
      }

      .sidebar {
        width: 280px;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }

      body.nav-open .sidebar {
        transform: none;
        box-shadow: var(--shadow);
      }

      .backdrop {
        position: fixed;
        inset: var(--topbar-h) 0 0 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 35;
      }

      body.nav-open .backdrop {
        display: block;
      }

      .main {
        margin-left: 0;
        padding: calc(var(--topbar-h) + 20px) 20px 48px;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        gap: 8px;
        padding: 0 10px;
      }

      .logo-text,
      .search kbd,
      .refresh-label {
        display: none;
      }

      .search input {
        padding-right: 12px;
      }

      #refresh-btn {
        width: 36px;
        padding: 0;
      }

      .main {
        padding: calc(var(--topbar-h) + 16px) 12px 40px;
      }

      #articles-container.grid-view {
        gap: 16px;
      }

      .list-view .card {
        grid-template-columns: minmax(0, 1fr) 96px;
        grid-template-areas:
          "title cover"
          "tags  cover"
          "meta  cover";
        column-gap: 12px;
        padding: 12px;
      }

      .list-view .card-top {
        display: none;
      }

      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        max-height: 92vh;
        overflow-y: auto;
        border-radius: 20px 20px 0 0;
        border-bottom: none;
      }

      .modal-body {
        padding: 18px 18px 28px;
      }

      .modal-title {
        font-size: 22px;
      }

      .modal-bar .read-label {
        display: none;
      }
    }

    /* ── ANIMATIONS ────────────────────────────────── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── SCROLLBAR ─────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-3);
    }

    /* Theme toggle icon swap */
    .icon-sun { display: none; }
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }
  </style>
</head>

  <script>
    // ── SOURCES ──────────────────────────────────────────────────────────────────
    const SOURCES = [
      { id: 'verge', name: 'The Verge', lang: 'en', site: 'theverge.com', url: 'https://www.theverge.com/rss/index.xml' },
      { id: 'ars', name: 'Ars Technica', lang: 'en', site: 'arstechnica.com', url: 'https://feeds.arstechnica.com/arstechnica/index' },
      { id: 'tc', name: 'TechCrunch', lang: 'en', site: 'techcrunch.com', url: 'https://techcrunch.com/feed/' },
      // WIRED's main /feed/rss is mostly SEO coupon/affiliate pages. Use the
      // real editorial category feeds instead so we get actual tech news.
      { id: 'wired-biz', name: 'WIRED Business', lang: 'en', site: 'wired.com', url: 'https://www.wired.com/feed/category/business/latest/rss' },
      { id: 'wired-sec', name: 'WIRED Security', lang: 'en', site: 'wired.com', url: 'https://www.wired.com/feed/category/security/latest/rss' },
      { id: 'mit', name: 'MIT Tech Review', lang: 'en', site: 'technologyreview.com', url: 'https://www.technologyreview.com/feed/' },
      { id: 'techradar', name: 'TechRadar', lang: 'en', site: 'techradar.com', url: 'https://www.techradar.com/feeds/articletype/news' },
      { id: 'xataka', name: 'Xataka', lang: 'es', site: 'xataka.com', url: 'https://www.xataka.com/feedburner.xml' },
      { id: 'omicrono', name: 'Omicrono', lang: 'es', site: 'elespanol.com', url: 'https://www.elespanol.com/rss/omicrono/' },
      { id: 'computing', name: 'Computing.es', lang: 'es', site: 'computing.es', url: 'https://www.computing.es/feed/' },
      { id: 'genbeta', name: 'Genbeta', lang: 'es', site: 'genbeta.com', url: 'https://www.genbeta.com/feedburner.xml' },
      { id: 'muycomputer', name: 'MuyComputer', lang: 'es', site: 'muycomputer.com', url: 'https://www.muycomputer.com/feed/' },
    ];

    const PROXY = url => `/api/feed?url=${encodeURIComponent(url)}`;
    const MAX_PER_SOURCE = 5;
    const MAX_AI_SUMMARIES = 12;

    const TOPIC_LABELS = { ai: 'AI', infra: 'Infrastructure', sec: 'Security', biz: 'Business' };
    const LANG_LABELS = { en: 'English', es: 'Español' };

    // ── ICONS ────────────────────────────────────────────────────────────────────
    const SVG = (body, extra = '') =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${extra}>${body}</svg>`;
    const ICON_LINK = SVG('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>');
    const ICON_EXTERNAL = SVG('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>');
    const ICON_CHECK = SVG('<polyline points="20 6 9 17 4 12"/>');
    const ICON_X = SVG('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>');
    const ICON_SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6 5.6 1.9-5.6 1.9L12 17l-1.9-5.6-5.6-1.9 5.6-1.9zM19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1-2.1-.9 2.1-.9z"/></svg>';

    // ── TOPIC CLASSIFICATION ─────────────────────────────────────────────────────
    const TOPIC_RULES = {
      ai: /\b(ai|artificial intelligence|machine learning|neural|llm|gpt|chatgpt|openai|gemini|claude|anthropic|deep learning|generative|transformer|copilot|midjourney|stable diffusion|model|robot|autonomous)\b/i,
      infra: /\b(cloud|aws|amazon web|azure|gcp|google cloud|kubernetes|k8s|docker|container|server|data center|chip|semiconductor|hardware|cpu|gpu|arm|risc|broadband|network|5g|6g|fiber|edge computing|devops|platform)\b/i,
      sec: /\b(security|hack|breach|vulnerability|malware|ransomware|privacy|encryption|cyber|threat|phishing|exploit|zero.day|cve|patch|password|authentication|2fa|mfa|spyware|surveillance)\b/i,
      biz: /\b(acquisition|funding|ipo|revenue|profit|merger|startup|investment|valuation|ceo|layoff|layoffs|billion|million|deal|partnership|quarter|earnings|stock|shares|market|bankrupt|regulation|antitrust|gdpr|lawsuit)\b/i,
    };

    function classifyTopic(text) {
      for (const [topic, rx] of Object.entries(TOPIC_RULES)) {
        if (rx.test(text)) return topic;
      }
      return 'other';
    }

    // ── STATE ────────────────────────────────────────────────────────────────────
    let allArticles = [];
    // null = no filter for that category (i.e. "All")
    let filters = { lang: null, topic: null, source: null, q: '' };
    let view = 'grid';
    let isLoading = false;
    let loadedSources = 0;
    const totalSources = SOURCES.length;

    // ── DOM ──────────────────────────────────────────────────────────────────────
    const container = document.getElementById('articles-container');
    const sidebar = document.getElementById('sidebar');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const statusSrc = document.getElementById('status-sources');
    const statusTime = document.getElementById('status-time');
    const countEl = document.getElementById('article-count');
    const feedTitleEl = document.getElementById('feed-title');
    const chipsEl = document.getElementById('active-chips');
    const searchInput = document.getElementById('search-input');
    const apiKeyInput = document.getElementById('api-key-input');
    const refreshBtn = document.getElementById('refresh-btn');

    // ── UTILS ────────────────────────────────────────────────────────────────────
    function timeAgo(date) {
      const diff = Date.now() - date.getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent || div.innerText || '';
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Feed-supplied URLs are untrusted: only allow http(s). Images are upgraded
    // to https so they don't trigger mixed-content blocking.
    function safeUrl(raw, forceHttps = false) {
      if (!raw) return '';
      let u = raw.trim().replace(/&amp;/g, '&');
      if (u.startsWith('//')) u = 'https:' + u;
      try {
        const url = new URL(u);
        if (forceHttps && url.protocol === 'http:') url.protocol = 'https:';
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch {
        return '';
      }
    }

    function sourceColor(id) {
      let h = 0;
      for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
      return `hsl(${h} 55% 42%)`;
    }

    // ── RSS PARSE ────────────────────────────────────────────────────────────────
    function extractImage(item, html) {
      // media:content / media:thumbnail match by local name in XML documents.
      for (const el of item.querySelectorAll('content, thumbnail')) {
        const url = el.getAttribute('url');
        const type = el.getAttribute('type') || '';
        const medium = el.getAttribute('medium') || '';
        if (url && (!type || type.startsWith('image')) && medium !== 'video') return safeUrl(url, true);
      }
      for (const el of item.querySelectorAll('enclosure')) {
        if ((el.getAttribute('type') || '').startsWith('image')) return safeUrl(el.getAttribute('url'), true);
      }
      for (const m of html.matchAll(/<img\b[^>]*>/gi)) {
        const tag = m[0];
        const src = tag.match(/\ssrc=["']([^"']+)["']/i)?.[1];
        if (!src || /width=["']?1["'\s>]/i.test(tag) || /feedburner|doubleclick|pixel/i.test(src)) continue;
        return safeUrl(src, true);
      }
      return '';
    }

    function parseRSS(xmlStr, source) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlStr, 'application/xml');
      const items = Array.from(doc.querySelectorAll('item, entry'));

      return items.slice(0, MAX_PER_SOURCE).map(item => {
        const title = item.querySelector('title')?.textContent?.trim() || 'Untitled';
        const link = item.querySelector('link')?.textContent?.trim()
          || item.querySelector('link')?.getAttribute('href')
          || '#';
        const pub = item.querySelector('pubDate, published, updated')?.textContent?.trim();

        // Pull the description in priority order. We must NOT use a bare
        // "content" selector: in namespaced feeds (e.g. WIRED) querySelector
        // matches by local name, so "content" collides with <media:content>
        // — an empty element that often precedes <description> in document
        // order, yielding an empty string. Read each field explicitly instead.
        const pick = sel => {
          const el = item.querySelector(sel);
          const t = el?.textContent?.trim();
          return t || '';
        };
        // Atom <content> has local name "content" too, so to fetch it without
        // also matching <media:content> we take the first "content" match that
        // carries text (Atom content is text/html; media:content is empty).
        const atomContent = () => {
          const els = item.querySelectorAll('content');
          for (const el of els) {
            const t = el.textContent?.trim();
            if (t) return t;
          }
          return '';
        };
        const encoded = pick('encoded');
        const atom = atomContent();
        const desc =
          pick('description') ||
          encoded ||           // content:encoded (RSS)
          pick('summary') ||   // Atom
          atom ||              // Atom <content>, skipping empty <media:content>
          '';
        const date = pub ? new Date(pub) : new Date();

        const plain = stripHtml(desc);
        const topic = classifyTopic(`${title} ${plain}`);

        return {
          id: `${source.id}-${link}`,
          title,
          link: safeUrl(link) || '#',
          date: isNaN(date) ? new Date() : date,
          description: plain.slice(0, 600),
          image: extractImage(item, `${encoded} ${atom} ${desc}`),
          source,
          topic,
          summary: null,
          summaryLoading: false,
        };
      });
    }

    // ── FETCH ────────────────────────────────────────────────────────────────────
    async function fetchSource(source) {
      try {
        const res = await fetch(PROXY(source.url), { signal: AbortSignal.timeout(12000) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        return parseRSS(text, source);
      } catch (e) {
        console.warn(`[${source.id}] fetch failed:`, e.message);
        return [];
      }
    }

    async function loadFeeds() {
      if (isLoading) return;
      isLoading = true;
      loadedSources = 0;
      allArticles = [];
      refreshBtn.classList.add('spinning');
      setStatus('loading', 'Fetching feeds…');
      statusSrc.textContent = `0 / ${totalSources} sources`;
      container.innerHTML = buildSkeletons(12);

      const promises = SOURCES.map(async source => {
        const articles = await fetchSource(source);
        loadedSources++;
        allArticles.push(...articles);
        statusSrc.textContent = `${loadedSources} / ${totalSources} sources`;
        if (loadedSources % 3 === 0 || loadedSources === totalSources) {
          allArticles.sort((a, b) => b.date - a.date);
          rebuildSourceNav();
          render();
        }
      });

      await Promise.allSettled(promises);

      allArticles.sort((a, b) => b.date - a.date);
      isLoading = false;
      refreshBtn.classList.remove('spinning');

      const now = new Date();
      statusTime.textContent = `Updated ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      if (allArticles.length) setStatus('ok', `${allArticles.length} articles loaded`);
      else setStatus('error', 'No feeds could be loaded');
      rebuildSourceNav();
      render();
      triggerAISummaries();
    }

    // ── RENDER ───────────────────────────────────────────────────────────────────
    function matches(a, type, value) {
      if (type === 'lang') return a.source.lang === value;
      if (type === 'topic') return a.topic === value;
      return a.source.id === value;
    }

    function filtered() {
      const q = filters.q.toLowerCase();
      return allArticles.filter(a => {
        if (filters.lang && !matches(a, 'lang', filters.lang)) return false;
        if (filters.topic && !matches(a, 'topic', filters.topic)) return false;
        if (filters.source && !matches(a, 'source', filters.source)) return false;
        if (q && !`${a.title} ${a.description} ${a.source.name}`.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function hasFilters() {
      return Boolean(filters.lang || filters.topic || filters.source || filters.q);
    }

    function render() {
      const articles = filtered();
      countEl.textContent = allArticles.length
        ? `${articles.length} post${articles.length !== 1 ? 's' : ''}`
        : '';
      renderFeedHead();
      syncSidebar();

      if (articles.length === 0) {
        if (isLoading && !allArticles.length) return; // keep skeletons
        container.innerHTML = hasFilters()
          ? `<div class="empty-state"><div><strong>Nothing here yet</strong>No posts match the current filters.</div>
               <button class="btn" data-action="clear-all">Clear filters</button></div>`
          : `<div class="empty-state"><div><strong>No posts loaded</strong>The feeds could not be reached. Try refreshing.</div></div>`;
        return;
      }

      container.innerHTML = articles.map(buildCard).join('');
    }

    function updateCard(a) {
      const el = container.querySelector(`.card[data-id="${CSS.escape(a.id)}"]`);
      if (el) el.outerHTML = buildCard(a);
    }

    function avatarHtml(s, size = '') {
      const favicon = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(s.site)}&sz=64`;
      return `<span class="src-avatar ${size}" style="--av:${sourceColor(s.id)}" aria-hidden="true">
        <b>${escapeHtml(s.name[0])}</b><img src="${escapeHtml(favicon)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
    }

    function tagsHtml(a) {
      const tags = [];
      if (a.topic !== 'other') tags.push(`<span class="tag tag-topic">#${TOPIC_LABELS[a.topic].toLowerCase()}</span>`);
      tags.push(`<span class="tag">#${a.source.lang}</span>`);
      return tags.join('');
    }

    function coverHtml(a) {
      const img = a.image
        ? `<img src="${escapeHtml(a.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="onImgError(this)">`
        : '';
      return `<div class="card-cover"><div class="cover-fallback"><span>${escapeHtml(a.source.name)}</span></div>${img}</div>`;
    }

    function buildCard(a) {
      const link = escapeHtml(a.link);
      let tldr = '';
      if (a.summary) {
        tldr = `<span class="act act-tldr" title="Claude summary available">${ICON_SPARK}TL;DR</span>`;
      } else if (a.summaryLoading) {
        tldr = `<span class="act act-tldr loading"><span class="summary-spinner"></span>Summarizing…</span>`;
      }

      return `
    <article class="card" tabindex="0" data-id="${escapeHtml(a.id)}" data-topic="${a.topic}">
      <div class="card-top">
        ${avatarHtml(a.source)}
        <a class="btn btn-primary read-btn" href="${link}" target="_blank" rel="noopener noreferrer">Read post ${ICON_EXTERNAL}</a>
      </div>
      <h3 class="card-title">${escapeHtml(a.title)}</h3>
      <div class="card-tags">${tagsHtml(a)}</div>
      <div class="card-meta">
        <span class="src">${escapeHtml(a.source.name)}</span><span>·</span>
        <time datetime="${a.date.toISOString()}">${timeAgo(a.date)}</time>
      </div>
      <div class="card-spacer"></div>
      ${coverHtml(a)}
      <div class="card-actions">
        ${tldr}
        <button class="act act-push" data-action="copy" title="Copy link" aria-label="Copy link">${ICON_LINK}</button>
        <a class="act" href="${link}" target="_blank" rel="noopener noreferrer" title="Open in new tab" aria-label="Open in new tab">${ICON_EXTERNAL}</a>
      </div>
    </article>`;
    }

    function buildSkeletons(n) {
      const card = `
    <div class="skeleton-card">
      <div class="skel" style="width:32px;height:32px;border-radius:50%"></div>
      <div class="skel" style="width:95%;height:16px;margin-top:4px"></div>
      <div class="skel" style="width:80%;height:16px"></div>
      <div class="skel" style="width:55%;height:16px"></div>
      <div style="display:flex;gap:6px;margin-top:2px">
        <div class="skel" style="width:48px;height:22px;border-radius:8px"></div>
        <div class="skel" style="width:36px;height:22px;border-radius:8px"></div>
      </div>
      <div class="skel" style="width:100%;aspect-ratio:16/9;border-radius:12px;margin-top:14px"></div>
    </div>`;
      return card.repeat(n);
    }

    // Remember broken images so re-renders don't retry them.
    window.onImgError = el => {
      const id = el.closest('[data-id]')?.dataset.id;
      const article = allArticles.find(a => a.id === id);
      if (article) article.image = '';
      if (el.parentElement?.id === 'modal-cover') el.parentElement.hidden = true;
      el.remove();
    };

    // ── FEED HEADER ──────────────────────────────────────────────────────────────
    function renderFeedHead() {
      const src = filters.source && SOURCES.find(s => s.id === filters.source);
      feedTitleEl.textContent = src
        ? src.name
        : filters.topic ? TOPIC_LABELS[filters.topic]
          : filters.lang ? LANG_LABELS[filters.lang]
            : 'My feed';

      const chips = [];
      if (filters.topic) chips.push(['topic', `#${TOPIC_LABELS[filters.topic].toLowerCase()}`]);
      if (filters.lang) chips.push(['lang', LANG_LABELS[filters.lang]]);
      if (src) chips.push(['source', src.name]);
      if (filters.q) chips.push(['q', `“${filters.q}”`]);
      chipsEl.innerHTML = chips
        .map(([type, label]) => `<button class="chip" data-clear="${type}" aria-label="Remove filter ${escapeHtml(label)}">${escapeHtml(label)}${ICON_X}</button>`)
        .join('');
      chipsEl.hidden = chips.length === 0;
    }

    chipsEl.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const type = chip.dataset.clear;
      if (type === 'q') {
        filters.q = '';
        searchInput.value = '';
      } else {
        filters[type] = null;
      }
      render();
    });

    // ── STATUS ───────────────────────────────────────────────────────────────────
    function setStatus(state, msg) {
      statusDot.className = `status-dot ${state}`;
      statusText.textContent = msg;
    }

    // ── SIDEBAR ──────────────────────────────────────────────────────────────────
    function rebuildSourceNav() {
      const present = SOURCES.filter(s => allArticles.some(a => a.source.id === s.id));
      document.getElementById('source-nav').innerHTML = present.map(s => `
        <li><button class="nav-item" data-type="source" data-value="${escapeHtml(s.id)}">
          ${avatarHtml(s, 'sm')}<span class="nav-label">${escapeHtml(s.name)}</span><span class="count"></span>
        </button></li>`).join('');
    }

    function syncSidebar() {
      const noFilter = !filters.lang && !filters.topic && !filters.source;
      sidebar.querySelectorAll('.nav-item').forEach(el => {
        const isReset = 'reset' in el.dataset;
        const { type, value } = el.dataset;
        const active = isReset ? noFilter : filters[type] === value;
        el.classList.toggle('active', active);
        el.setAttribute('aria-pressed', String(active));
        const n = isReset ? allArticles.length : allArticles.filter(a => matches(a, type, value)).length;
        el.querySelector('.count').textContent = n || '';
      });
    }

    // Toggle model: no item active = All. Clicking an item selects it (and
    // deselects siblings); clicking the active item again clears it back to All.
    sidebar.addEventListener('click', e => {
      const item = e.target.closest('.nav-item');
      if (!item) return;
      if ('reset' in item.dataset) {
        filters = { lang: null, topic: null, source: null, q: '' };
        searchInput.value = '';
      } else {
        const { type, value } = item.dataset;
        filters[type] = filters[type] === value ? null : value;
      }
      closeNav();
      render();
      window.scrollTo({ top: 0 });
    });

    const openNav = () => document.body.classList.add('nav-open');
    const closeNav = () => document.body.classList.remove('nav-open');
    document.getElementById('menu-btn').addEventListener('click', () => {
      document.body.classList.contains('nav-open') ? closeNav() : openNav();
    });
    document.getElementById('backdrop').addEventListener('click', closeNav);

    // ── SEARCH ───────────────────────────────────────────────────────────────────
    searchInput.addEventListener('input', () => {
      filters.q = searchInput.value.trim();
      render();
    });

    // ── CARD INTERACTIONS ────────────────────────────────────────────────────────
    async function copyLink(btn, article) {
      try {
        await navigator.clipboard.writeText(article.link);
        btn.classList.add('copied');
        btn.innerHTML = ICON_CHECK;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = ICON_LINK;
        }, 1400);
      } catch (e) {
        console.warn('Copy failed:', e.message);
      }
    }

    function clearAll() {
      filters = { lang: null, topic: null, source: null, q: '' };
      searchInput.value = '';
      render();
    }

    container.addEventListener('click', e => {
      if (e.target.closest('[data-action="clear-all"]')) return clearAll();
      const card = e.target.closest('.card');
      if (!card) return;
      const copyBtn = e.target.closest('[data-action="copy"]');
      if (copyBtn) {
        const article = allArticles.find(a => a.id === card.dataset.id);
        if (article) copyLink(copyBtn, article);
        return;
      }
      if (e.target.closest('a')) return;
      openModal(card.dataset.id);
    });

    container.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.classList.contains('card')) openModal(e.target.dataset.id);
    });

    // ── VIEW TOGGLE ──────────────────────────────────────────────────────────────
    function setView(next) {
      view = next;
      container.className = `${view}-view`;
      document.getElementById('grid-btn').classList.toggle('active', view === 'grid');
      document.getElementById('list-btn').classList.toggle('active', view === 'list');
    }

    document.getElementById('grid-btn').addEventListener('click', () => setView('grid'));
    document.getElementById('list-btn').addEventListener('click', () => setView('list'));

    // ── REFRESH ──────────────────────────────────────────────────────────────────
    refreshBtn.addEventListener('click', () => loadFeeds());

    // ── THEME TOGGLE ─────────────────────────────────────────────────────────────
    const root = document.documentElement;
    document.getElementById('theme-btn').addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('signal_theme', next);
    });

    // ── FOOTER YEAR ──────────────────────────────────────────────────────────────
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    // ── API KEY ──────────────────────────────────────────────────────────────────
    apiKeyInput.value = localStorage.getItem('claude_api_key') || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('claude_api_key', apiKeyInput.value.trim());
      triggerAISummaries();
    });

    // ── AI SUMMARIES ─────────────────────────────────────────────────────────────
    let summarizing = false;

    async function triggerAISummaries() {
      const key = apiKeyInput.value.trim() || localStorage.getItem('claude_api_key');
      if (!key || summarizing) return;
      summarizing = true;

      const targets = filtered().slice(0, MAX_AI_SUMMARIES);

      for (const article of targets) {
        if (article.summary) continue;
        article.summaryLoading = true;
        updateCard(article);

        try {
          const lang = article.source.lang === 'es' ? 'Spanish' : 'English';
          const prompt = `Summarize this tech news article in ONE short sentence (max 22 words) in ${lang}. Capture the key takeaway only. Be direct. Do not start with "This article" or "The article".

Title: ${article.title}
Content: ${article.description}`;

          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': key,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-calls': 'true',
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 80,
              messages: [{ role: 'user', content: prompt }],
            }),
          });

          if (!res.ok) throw new Error(`Anthropic API ${res.status}`);
          const data = await res.json();
          article.summary = data.content?.[0]?.text?.trim() || '';
        } catch (e) {
          console.warn('Summary failed:', e.message);
          article.summary = null;
        }

        article.summaryLoading = false;
        updateCard(article);
        if (document.getElementById('modal').dataset.id === article.id) fillModalSummary(article);
      }

      summarizing = false;
    }

    // ── MODAL ────────────────────────────────────────────────────────────────────
    function fillModalSummary(article) {
      document.getElementById('modal-summary-text').textContent = article.summary || '';
      document.getElementById('modal-summary').hidden = !article.summary;
    }

    function openModal(id) {
      const article = allArticles.find(a => a.id === id);
      if (!article) return;

      const modal = document.getElementById('modal');
      modal.dataset.id = article.id;
      modal.dataset.topic = article.topic;

      const locale = article.source.lang === 'es' ? 'es-ES' : 'en-US';
      const dateStr = article.date.toLocaleDateString(locale, { year: 'numeric', month: 'short', day: 'numeric' });
      document.getElementById('modal-source').innerHTML = `${avatarHtml(article.source)}
        <div><strong>${escapeHtml(article.source.name)}</strong><span>${dateStr} · ${timeAgo(article.date)}</span></div>`;

      document.getElementById('modal-title').textContent = article.title;
      document.getElementById('modal-tags').innerHTML = tagsHtml(article);
      fillModalSummary(article);

      const cover = document.getElementById('modal-cover');
      cover.innerHTML = article.image
        ? `<img src="${escapeHtml(article.image)}" alt="" referrerpolicy="no-referrer" onerror="onImgError(this)">`
        : '';
      cover.hidden = !article.image;

      document.getElementById('modal-description').textContent = article.description || 'No preview available.';
      document.getElementById('modal-link').href = article.link;

      document.getElementById('modal-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
      document.getElementById('modal-close').focus();
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (!overlay.classList.contains('open')) return;
      overlay.classList.remove('open');
      document.getElementById('modal').dataset.id = '';
      document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    // ── KEYBOARD ─────────────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal();
        closeNav();
        return;
      }
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
      const modalOpen = document.getElementById('modal-overlay').classList.contains('open');
      if (e.key === '/' && !typing && !modalOpen) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // ── INIT ─────────────────────────────────────────────────────────────────────
    loadFeeds();
  </script>
</body>

</html>
